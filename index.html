<!DOCTYPE html>
<html class="light" lang="en">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Emoji Generator</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>


<style>

/* ============================================================
   GRID EMOJI STYLES
   ============================================================ */

.grid {
  display: grid;
  grid-template-columns: repeat(5, 80px);
  grid-template-rows: repeat(5, 80px);
  gap: 10px;
  margin-top: 20px;
}

.emotion-box {
  border: 2px solid black;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}

.emotion-box:hover {
  background: #ffd33d;
  transform: scale(1.1);
}

.center-box {
  border: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
}

.emoji {
  font-size: 60px;
  transition: transform 0.4s ease, opacity 0.4s ease;
  animation: idle 2s infinite ease-in-out;
}


/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes idle {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.05);
  }

}

@keyframes bounce {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-15px);
  }

}

@keyframes shake {

  0%,100% {
    transform: rotate(0deg);
  }

  25% {
    transform: rotate(10deg);
  }

  75% {
    transform: rotate(-10deg);
  }

}

@keyframes pulse {

  0%,100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.2);
  }

}

@keyframes zoom {

  0% {
    transform: scale(0);
    opacity: 0;
  }

  50% {
    transform: scale(1.3);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }

}

</style>


<script id="tailwind-config">

tailwind.config = {

  darkMode: "class",

  theme: {

    extend: {

      colors: {

        "primary": "#137fec",

        "background-light": "#f6f7f8",

        "background-dark": "#101922",

      },

      fontFamily: {

        "display": ["Space Grotesk", "sans-serif"]

      },

      borderRadius: {

        "DEFAULT": "0.25rem",

        "lg": "0.5rem",

        "xl": "0.75rem",

        "full": "9999px"

      }

    }

  }

}

</script>

</head>


<body

justify-content: center;

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->

<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const btn =
    document.getElementById("generate-btn");

const input =
    document.getElementById("text-input");

const outputContainer =
    document.getElementById("output-container");

const gridEmoji =
    document.getElementById("emoji");


/* ============================================================
   GENERATE EMOJI
   ============================================================ */

btn.addEventListener("click", async () => {


    const text =
        input.value.trim();


    if (!text) {

        alert("Please type something!");

        return;

    }


    /* --------------------------------------------------------
       Loading state
       -------------------------------------------------------- */

    outputContainer.innerHTML = `

        <div class="flex flex-col items-center gap-3">

            <div
                class="text-5xl"
                style="animation: pulse 1s infinite;"
            >
                ✨
            </div>

            <p
                class="text-base font-medium text-[#4c739a]"
            >
                Understanding your text...
            </p>

        </div>

    `;


    try {


        /* ----------------------------------------------------
           CALL FLASK BACKEND

           IMPORTANT:
           Using /predict instead of
           http://127.0.0.1:5000/predict

           This works both locally and after deployment.
           ---------------------------------------------------- */

        const response =
            await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text: text
                })

            });


        const data =
            await response.json();


        /* ----------------------------------------------------
           BACKEND ERROR
           ---------------------------------------------------- */

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Prediction failed."
            );

        }


        /* ----------------------------------------------------
           BEST AI EMOJI
           ---------------------------------------------------- */

        const bestEmoji =
            data.emoji || "🙂";


        /* ----------------------------------------------------
           TOP 3 AI PREDICTIONS
           ---------------------------------------------------- */

        const predictions =
            Array.isArray(data.predictions)
                ? data.predictions
                : [];


        /* ----------------------------------------------------
           OTHER AI SUGGESTIONS
           ---------------------------------------------------- */

        let suggestionsHTML = "";


        if (predictions.length > 1) {


            const alternatives =
                predictions.slice(1, 3);


            suggestionsHTML = `

                <div class="w-full mt-2">

                    <p
                        class="text-sm font-medium text-[#4c739a] mb-3"
                    >
                        Other AI suggestions
                    </p>


                    <div
                        class="flex justify-center gap-4"
                    >

                        ${
                            alternatives
                            .map(item => `

                                <div
                                    class="
                                    flex
                                    flex-col
                                    items-center
                                    justify-center
                                    w-20
                                    h-20
                                    rounded-xl
                                    border
                                    border-[#cfdbe7]
                                    bg-background-light
                                    shadow-sm
                                    hover:scale-105
                                    transition-transform
                                    "
                                >

                                    <span
                                        class="text-4xl"
                                    >
                                        ${item.emoji}
                                    </span>

                                </div>

                            `)
                            .join("")
                        }

                    </div>

                </div>

            `;

        }


        /* ----------------------------------------------------
           DISPLAY RESULT
           ---------------------------------------------------- */

        outputContainer.innerHTML = `

            <div
                class="flex flex-col items-center gap-4 w-full"
            >

                <p
                    class="text-sm font-medium text-[#4c739a]"
                >
                    Best Match
                </p>


                <div
                    class="text-7xl"
                    style="animation: zoom 0.7s ease;"
                >
                    ${bestEmoji}
                </div>


                ${suggestionsHTML}

            </div>

        `;


    }

    catch (error) {


        console.error(
            "Emoji generation error:",
            error
        );


        outputContainer.innerHTML = `

            <div
                class="flex flex-col items-center gap-3"
            >

                <div class="text-5xl">
                    ⚠️
                </div>


                <p
                    class="text-base font-bold text-[#0d141b]"
                >
                    Unable to generate emoji
                </p>


                <p
                    class="text-sm text-[#4c739a] text-center"
                >
                    Please make sure the AI backend is running.
                </p>

            </div>

        `;

    }

});


/* ============================================================
   EMOJI GRID
   ============================================================

   IMPORTANT:

   This grid is only a UI feature.

   These emojis DO NOT control the AI prediction.

   The "Generate Emoji" button sends the text to
   Hugging Face and the AI independently chooses
   the emoji.
   ============================================================ */


const emojiMap = {

    happy: "😊",

    sad: "😢",

    angry: "😡",

    love: "😍",

    cool: "😎",

    surprised: "😲",

    bored: "🤨",

    shy: "🥰",

    confused: "😕",

    tired: "😴",

    scared: "😱",

    neutral: "😐",

    funny: "😂",

    cry: "😭",

    wink: "😉",

    kiss: "😘"

};


const animationMap = {

    happy: "bounce 1s ease",

    sad: "pulse 1s ease",

    angry: "shake 0.6s ease",

    love: "pulse 1s ease",

    cool: "bounce 1s ease",

    surprised: "zoom 0.7s ease",

    bored: "pulse 1s ease",

    shy: "zoom 1s ease",

    confused: "shake 0.8s ease",

    tired: "pulse 1s ease",

    scared: "zoom 1s ease",

    neutral: "none",

    funny: "bounce 1s ease",

    cry: "pulse 1s ease",

    wink: "zoom 0.8s ease",

    kiss: "pulse 1s ease"

};


/* ============================================================
   GRID EMOJI FUNCTION
   ============================================================ */

function showEmoji(emotion) {


    if (!emojiMap[emotion]) {

        return;

    }


    gridEmoji.textContent =
        emojiMap[emotion];


    gridEmoji.style.animation =
        animationMap[emotion];


    gridEmoji.style.transform =
        "scale(1.2)";


    setTimeout(() => {


        gridEmoji.textContent =
            "🟡";


        gridEmoji.style.animation =
            "idle 5s infinite ease-in-out";


        gridEmoji.style.transform =
            "scale(1)";


    }, 1500);

}

</script>
